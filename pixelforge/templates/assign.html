{% extends 'layout.html' %}
{% block content %}
<h2>Assign to {{ project.name }}</h2>
<form method="post">
<select name="user_id">
{% for u in users %}
  <option value="{{ u.id }}">{{ u.username }} ({{ u.role }})</option>
{% endfor %}
</select>
<input type="submit" value="Assign">
</form>
{% endblock %}
